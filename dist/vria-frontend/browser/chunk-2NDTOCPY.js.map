<div class="vria-page">
  <app-page-header title="Usuarios" subtitle="Administra las cuentas del sistema VRIA." icon="manage_accounts">
    <button mat-flat-button color="primary" class="vria-btn" (click)="openForm(null)">
      <mat-icon>person_add</mat-icon>
      Nuevo usuario
    </button>
  </app-page-header>

  <div class="list-toolbar">
    <mat-form-field appearance="outline" class="list-toolbar__search">
      <mat-label>Buscar</mat-label>
      <input matInput [(ngModel)]="searchTerm" (ngModelChange)="applyFilter()" placeholder="Nombre o correo" />
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>
  </div>

  <div class="vria-card data-table-card">
    <table mat-table [dataSource]="filtered" class="data-table">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let row">
          <div class="user-cell">
            <span class="user-cell__avatar">{{ row.name | initials }}</span>
            {{ row.name }} {{ row.lastName }}
          </div>
        </td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Correo</th>
        <td mat-cell *matCellDef="let row">{{ row.email }}</td>
      </ng-container>

      <ng-container matColumnDef="role">
        <th mat-header-cell *matHeaderCellDef>Rol</th>
        <td mat-cell *matCellDef="let row">
          <mat-chip class="state-chip">{{ row.role | roleLabel }}</mat-chip>
        </td>
      </ng-container>

      <ng-container matColumnDef="enabled">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let row">
          <span class="status-dot" [class.status-dot--off]="!row.enabled"></span>
          {{ row.enabled ? 'Activo' : 'Inactivo' }}
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let row">
          <div class="cell-actions">
            <button mat-icon-button class="vria-btn-warning" (click)="openForm(row)" matTooltip="Editar">
              <mat-icon>edit</mat-icon>
            </button>
            <button
              mat-icon-button
              *ngIf="authService.currentUser?.idUser !== row.idUser"
              (click)="remove(row)"
              matTooltip="Eliminar"
              color="warn"
            >
              <mat-icon>delete</mat-icon>
            </button>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns" class="fade-row"></tr>
    </table>

    <app-empty-state
      *ngIf="!loading && filtered.length === 0"
      icon="manage_accounts"
      title="No hay usuarios"
      message="Crea el primer usuario del sistema."
    ></app-empty-state>
  </div>
</div>
