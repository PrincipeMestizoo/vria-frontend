<h2 mat-dialog-title>{{ isEdit ? 'Editar categoría' : 'Nueva categoría' }}</h2>

<form [formGroup]="form" (ngSubmit)="submit()">
  <mat-dialog-content>
    <mat-form-field appearance="outline">
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="nameCategory" />
      <mat-error *ngIf="form.get('nameCategory')?.invalid">
        {{ errorFor('nameCategory', 'El nombre') }}
      </mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Tipo de categoría</mat-label>
      <mat-select formControlName="idTypeCategory">
        <mat-option *ngFor="let type of types" [value]="type.idTypeCategory">
          {{ type.nameTypeCategory }}
        </mat-option>
      </mat-select>
      <mat-hint *ngIf="!loadingTypes && types.length === 0">
        No hay tipos de categoría. Crea uno primero.
      </mat-hint>
      <mat-error *ngIf="form.get('idTypeCategory')?.invalid">
        {{ errorFor('idTypeCategory', 'El tipo de categoría') }}
      </mat-error>
    </mat-form-field>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Cancelar</button>
    <app-submit-button
      [label]="isEdit ? 'Guardar cambios' : 'Crear'"
      [loading]="loading"
      [disabled]="form.invalid"
    ></app-submit-button>
  </mat-dialog-actions>
</form>
