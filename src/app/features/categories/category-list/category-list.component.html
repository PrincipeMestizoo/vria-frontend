<div class="vria-page">
  <app-page-header
    title="Categorías"
    subtitle="Organiza el catálogo de productos por categoría."
    icon="category"
  >
    <button mat-flat-button color="primary" class="vria-btn" *ngIf="canManage" (click)="openForm(null)">
      <mat-icon>add</mat-icon>
      Nueva categoría
    </button>
  </app-page-header>

  <div class="list-toolbar">
    <mat-form-field appearance="outline" class="list-toolbar__search">
      <mat-label>Buscar</mat-label>
      <input matInput [(ngModel)]="searchTerm" (ngModelChange)="applyFilter()" placeholder="Nombre de categoría" />
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>
  </div>

  <div class="vria-card data-table-card">
    <table mat-table [dataSource]="filtered" class="data-table">
      <ng-container matColumnDef="nameCategory">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let row">{{ row.nameCategory }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let row">
          <div class="cell-actions">
            <button mat-icon-button class="vria-btn-warning" *ngIf="canManage" (click)="openForm(row)" matTooltip="Editar">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button *ngIf="canDelete" (click)="remove(row)" matTooltip="Eliminar" color="warn">
              <mat-icon>delete</mat-icon>
            </button>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns" class="fade-row"></tr>
    </table>

    <app-empty-state
      *ngIf="!loading && filtered.length === 0"
      icon="category"
      title="No hay categorías"
      message="Crea la primera categoría para tu catálogo de productos."
    ></app-empty-state>
  </div>
</div>
