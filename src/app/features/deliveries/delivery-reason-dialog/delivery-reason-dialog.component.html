<h2 mat-dialog-title>{{ data.title }}</h2>
<form (ngSubmit)="confirm()">
  <mat-dialog-content>
    <p>{{ data.message }}</p>
    <mat-form-field appearance="outline">
      <mat-label>Motivo</mat-label>
      <textarea
        matInput
        [formControl]="reason"
        [maxlength]="maxLength"
        cdkTextareaAutosize
        cdkAutosizeMinRows="3"
        [placeholder]="data.placeholder || 'Describe por qué se realiza el cambio'"
        cdkFocusInitial
      ></textarea>
      <mat-hint align="end">{{ reason.value.length }} / {{ maxLength }}</mat-hint>
      <mat-error *ngIf="reason.invalid">{{ error }}</mat-error>
    </mat-form-field>
  </mat-dialog-content>
  <mat-dialog-actions align="end">
    <button mat-button type="button" (click)="cancel()">Cancelar</button>
    <button mat-flat-button type="submit" class="vria-btn" [color]="data.danger ? 'warn' : 'primary'">
      {{ data.confirmLabel }}
    </button>
  </mat-dialog-actions>
</form>
