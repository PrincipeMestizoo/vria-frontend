<div class="vria-page">
  <app-page-header
    title="Productos"
    subtitle="Catálogo digital de productos disponibles."
    icon="inventory_2"
  >
    <button mat-flat-button color="primary" class="vria-btn" *ngIf="canManage" (click)="openForm(null)">
      <mat-icon>add</mat-icon>
      Nuevo producto
    </button>
  </app-page-header>

  <div class="list-toolbar">
    <mat-form-field appearance="outline" class="list-toolbar__search">
      <mat-label>Buscar</mat-label>
      <input
        matInput
        [(ngModel)]="searchTerm"
        (ngModelChange)="applyFilter()"
        placeholder="Nombre, categoría o referencia"
      />
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>
  </div>

  <div class="vria-card data-table-card">
    <table mat-table [dataSource]="filtered" class="data-table">
      <ng-container matColumnDef="nameProduct">
        <th mat-header-cell *matHeaderCellDef>Producto</th>
        <td mat-cell *matCellDef="let row">
          <div class="product-cell">
            <span class="product-cell__name">{{ row.nameProduct }}</span>
            <span class="product-cell__ref" *ngIf="row.reference">Ref. {{ row.reference }}</span>
          </div>
        </td>
      </ng-container>

      <ng-container matColumnDef="nameCategory">
        <th mat-header-cell *matHeaderCellDef>Categoría</th>
        <td mat-cell *matCellDef="let row">
          <mat-chip class="state-chip">{{ row.nameCategory }}</mat-chip>
        </td>
      </ng-container>

      <ng-container matColumnDef="stock">
        <th mat-header-cell *matHeaderCellDef>Stock</th>
        <td mat-cell *matCellDef="let row">
          <span class="stock-badge" [class.stock-badge--low]="row.stock <= 5">{{ row.stock }}</span>
        </td>
      </ng-container>

      <ng-container matColumnDef="price">
        <th mat-header-cell *matHeaderCellDef>Precio</th>
        <td mat-cell *matCellDef="let row">{{ row.price | currency: 'COP' : 'symbol-narrow' : '1.0-0' }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let row">
          <div class="cell-actions">
            <button mat-icon-button class="vria-btn-warning" *ngIf="canManage" (click)="openForm(row)" matTooltip="Editar">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button *ngIf="canDelete" (click)="remove(row)" matTooltip="Eliminar" color="warn">
              <mat-icon>delete</mat-icon>
            </button>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns" class="fade-row"></tr>
    </table>

    <app-empty-state
      *ngIf="!loading && filtered.length === 0"
      icon="inventory_2"
      title="No hay productos"
      message="Agrega tu primer producto para comenzar a vender."
    ></app-empty-state>
  </div>
</div>
