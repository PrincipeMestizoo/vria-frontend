<div class="vria-page">
  <app-page-header title="Transferencias" subtitle="Comprobantes de pago por transferencia." icon="receipt_long">
    <button mat-flat-button color="primary" class="vria-btn" (click)="openForm()">
      <mat-icon>add</mat-icon>
      Nueva transferencia
    </button>
  </app-page-header>

  <div class="list-toolbar">
    <mat-form-field appearance="outline" class="list-toolbar__search">
      <mat-label>Buscar</mat-label>
      <input matInput [(ngModel)]="searchTerm" (ngModelChange)="applyFilter()" placeholder="Cliente, banco o destino" />
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>
  </div>

  <div class="vria-card data-table-card">
    <table mat-table [dataSource]="filtered" class="data-table">
      <ng-container matColumnDef="nameClient">
        <th mat-header-cell *matHeaderCellDef>Cliente</th>
        <td mat-cell *matCellDef="let row">{{ row.nameClient }}</td>
      </ng-container>

      <ng-container matColumnDef="bank">
        <th mat-header-cell *matHeaderCellDef>Banco</th>
        <td mat-cell *matCellDef="let row">{{ row.bank }}</td>
      </ng-container>

      <ng-container matColumnDef="destination">
        <th mat-header-cell *matHeaderCellDef>Destino</th>
        <td mat-cell *matCellDef="let row">{{ row.destination }}</td>
      </ng-container>

      <ng-container matColumnDef="dateTransfer">
        <th mat-header-cell *matHeaderCellDef>Fecha</th>
        <td mat-cell *matCellDef="let row">{{ row.dateTransfer | date: 'd MMM y, h:mm a' }}</td>
      </ng-container>

      <ng-container matColumnDef="amount">
        <th mat-header-cell *matHeaderCellDef>Monto</th>
        <td mat-cell *matCellDef="let row">{{ row.amount | currency: 'COP' : 'symbol-narrow' : '1.0-0' }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let row">
          <div class="cell-actions">
            <button mat-icon-button *ngIf="canDelete" (click)="remove(row)" matTooltip="Eliminar" color="warn">
              <mat-icon>delete</mat-icon>
            </button>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns" class="fade-row"></tr>
    </table>

    <app-empty-state
      *ngIf="!loading && filtered.length === 0"
      icon="receipt_long"
      title="No hay transferencias"
      message="Registra el primer comprobante de transferencia."
    ></app-empty-state>
  </div>
</div>
