<button
  mat-flat-button
  *ngIf="variant !== 'stroked'"
  class="vria-btn"
  [class.vria-btn--warn]="variant === 'warn'"
  [class.vria-btn--accent]="variant === 'accent'"
  [color]="variant === 'warn' ? 'warn' : 'primary'"
  [type]="type"
  [disabled]="isDisabled"
  (click)="onClick()"
>
  <mat-spinner *ngIf="loading" diameter="18" strokeWidth="3" class="vria-btn__spinner"></mat-spinner>
  <mat-icon *ngIf="icon && !loading">{{ icon }}</mat-icon>
  <span>{{ loading ? loadingLabel : label }}</span>
</button>

<button
  mat-stroked-button
  *ngIf="variant === 'stroked'"
  class="vria-btn vria-btn--stroked"
  color="primary"
  [type]="type"
  [disabled]="isDisabled"
  (click)="onClick()"
>
  <mat-spinner *ngIf="loading" diameter="18" strokeWidth="3" class="vria-btn__spinner"></mat-spinner>
  <mat-icon *ngIf="icon && !loading">{{ icon }}</mat-icon>
  <span>{{ loading ? loadingLabel : label }}</span>
</button>
